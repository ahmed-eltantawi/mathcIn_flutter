name: MatchIn
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  countrify: ^2.5.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.11.1
  equatable: ^2.1.0
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.1.0
  flutter_staggered_animations: ^1.1.1
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  get_it: ^9.2.1
  go_router: ^18.0.1
  google_mobile_ads: ^9.1.0
  google_nav_bar: ^5.0.7
  image_picker: ^1.1.2
  intl: ^0.20.3
  lottie: ^3.5.1
  otp_animated_fields: ^0.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  google_sign_in: ^6.3.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  flutter_local_notifications: ^22.3.2
  path_provider: ^2.1.6

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  intl_utils: ^2.8.1

flutter:
  uses-material-design: true
  generate: true

  #! =============== Assets ===============
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/privacy_policy/

  #! =============== Fonts ===============
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/dm_sans/DMSans_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/dm_sans/DMSans_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/dm_sans/DMSans_18pt-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter_18pt-Bold.ttf
          weight: 700

    - family: Alexandria
      fonts:
        - asset: assets/fonts/alexandria/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/alexandria/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/alexandria/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/alexandria/Alexandria-Bold.ttf
          weight: 700

    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700

#! The following section is specific to Flutter Intl package
flutter_intl:
  enabled: true
  #! The following section is specific to assets generation
flutter_assets:
  assets_path: assets/
  output_path: lib/core/utils/
  filename: app_assets.dart
  field_prefix: null

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#092856"
  adaptive_icon_foreground: "assets/images/app_icon.png"
